<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0b12" />
    <meta name="description" content="Generate scroll-stopping Instagram & TikTok captions and video scripts instantly with AI." />
    <title>Caption & Script Lab — AI Content Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0c0b12; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.4; }
      }
      .gen-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 32px rgba(255,80,120,0.45) !important;
      }
      .caption-card:hover {
        border-color: rgba(168,85,247,0.35) !important;
        background: rgba(168,85,247,0.07) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
